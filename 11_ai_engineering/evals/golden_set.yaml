    # Item scope removed during review: it was set to Item 1, but of the 51
    # chunks naming Xilinx in this filing only 2 sit there, against 8 in Item 7.
    # A scope that excludes where the answer lives measures the scope, not the
    # retriever.
    scope: {ticker: AMD, fiscal_year: 2022}
