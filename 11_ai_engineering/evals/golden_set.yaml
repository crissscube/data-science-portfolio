# Golden set -- the measuring instrument for every experiment in this project.
#
# Written before the retrieval improvements exist, on purpose. A question set
# authored after the fact drifts toward whatever the system already answers
# well, and the resulting numbers mean nothing.
#
# Seven of these questions are unanswerable from this corpus and six ask for
# figures buried in financial tables. Both groups are expected to score badly.
# They are here because a retrieval system that cannot tell "I don't know" from
# "here is a plausible number" is dangerous in a financial setting, and the
# honest way to report that is to measure it.
#
# Fields
#   id                stable identifier; never renumber, results reference it
#   category          see the taxonomy below
#   question          asked verbatim to the system
#   scope             where the answer should live; null when unconstrained
#   expected_answer   filled in by hand during review -- the human ground truth
#   gold_chunk_ids    chunks that genuinely support the answer, set in review
#   must_abstain      true when the correct behaviour is refusing to answer
#   status            draft | reviewed  -- only reviewed rows count in results
#
# Categories
#   factual_single        one fact, one document
#   comparative_temporal  same issuer, different fiscal years
#   comparative_cross     different issuers, same year
#   acronym_literal       rare proper nouns dense retrieval tends to blur
#   numeric               figures that live in tables
#   unanswerable          not in the corpus; abstaining is the right answer
#   multi_hop             requires combining separate chunks

questions:

  # --- factual_single -------------------------------------------------------

  - id: q001
    category: factual_single
    question: What does NVIDIA say about its dependence on third-party foundries to manufacture its products?
    scope: {ticker: NVDA, fiscal_year: 2024, item: "1A"}
    expected_answer: null
    gold_chunk_ids: []
    must_abstain: false
    status: draft

  - id: q002
